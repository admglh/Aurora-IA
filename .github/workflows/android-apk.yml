
name: Build Aurora 0.3 Corrigida

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Aurora 0.3 Corrigida
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract corrected Aurora
        run: |
          test -f Aurora-0.3-CORRIGIDA-PATCH.zip
          mkdir -p /tmp/aurora-corrigida
          unzip -q Aurora-0.3-CORRIGIDA-PATCH.zip -d /tmp/aurora-corrigida
          test -f /tmp/aurora-corrigida/gradlew
          grep -E 'applicationId|versionCode|versionName' /tmp/aurora-corrigida/app/build.gradle.kts

      - name: Build corrected APK
        run: |
          cd /tmp/aurora-corrigida
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-0.3-Corrigida-debug-apk
          path: /tmp/aurora-corrigida/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
